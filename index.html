
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESSAY_DESKTOP</title>

<style>
* { box-sizing: border-box; }

:root {
  --desktop: #202c3b;
  --paper: #f7f6f2;
  --ink: #242424;
  --muted: #858585;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: var(--ink);
  background: var(--desktop);
  min-height: 100vh;
}

.desktop {
  min-height: 100vh;
  padding: 25px;
  padding-bottom: 65px;
  display: grid;
  grid-template-columns: repeat(auto-fill, 100px);
  grid-auto-rows: 112px;
  gap: 12px;
  align-content: start;
  background:
    radial-gradient(ellipse at 70% 15%, #46576b 0, transparent 48%),
    linear-gradient(135deg, #26394c, #17212e);
}

.file {
  border: 0;
  color: white;
  background: transparent;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  padding: 8px 3px;
  border-radius: 7px;
  min-width: 0;
  font: inherit;
}

.file:hover, .file:focus-visible {
  background: #ffffff24;
  outline: 1px solid #ffffff70;
}

.file-icon {
  font-size: 38px;
  filter: drop-shadow(0 3px 3px #0005);
}

.filename {
  font-size: 12px;
  line-height: 1.3;
  text-align: center;
  overflow-wrap: anywhere;
  text-shadow: 0 1px 3px #000;
}

.taskbar {
  height: 42px;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #111a25ef;
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  font-size: 12px;
  backdrop-filter: blur(10px);
  z-index: 5;
}

.window {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(720px, 92vw);
  max-height: 78vh;
  display: none;
  flex-direction: column;
  background: var(--paper);
  color: var(--ink);
  border-radius: 8px;
  box-shadow: 0 18px 70px #0008;
  overflow: hidden;
  z-index: 10;
}

.titlebar {
  flex-shrink: 0;
  background: #e7e7e7;
  padding: 11px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #ccc;
  font-size: 13px;
}

.titlebar-label {
  display: flex;
  align-items: center;
  gap: 8px;
}

.close {
  border: 0;
  background: #d5d5d5;
  border-radius: 4px;
  cursor: pointer;
  padding: 5px 10px;
}

.close:hover { background: #c2c2c2; }

.content {
  padding: 25px;
  overflow: auto;
  line-height: 1.75;
  font-size: 14px;
}

.content h2 { font-size: 20px; line-height: 1.35; }
.content h3 { font-size: 15px; }
.content p { margin: 0 0 16px; }
.content hr { border: 0; border-top: 1px solid #ddd; margin: 22px 0; }
.content code { overflow-wrap: anywhere; }

.paper {
  background: white;
  font-family: Georgia, serif;
  line-height: 1.85;
  padding: 4px;
}

.paper h2 { font-weight: normal; }

.mono {
  font-family: monospace;
  letter-spacing: 2px;
  line-height: 2;
  overflow-wrap: anywhere;
  background: #ececec;
  padding: 14px;
  color: #333;
}

.hint {
  color: #888;
  font-size: 12px;
  font-style: italic;
  line-height: 1.5;
}

.blur {
  filter: blur(5px);
  cursor: pointer;
  transition: filter .3s;
  user-select: none;
}

.blur:hover, .blur:focus {
  filter: none;
  user-select: text;
  outline: none;
}

.invisible {
  color: white;
  background: white;
  cursor: text;
  user-select: text;
  transition: background .2s;
}

.invisible::selection {
  color: white;
  background: #345d9d;
}

.invisible:hover {
  background: #f0f0f0;
}

.invisible:focus {
  color: #333;
  outline: 1px dotted #999;
}

.image-simulation {
  background: #fff;
  padding: 25px 15px;
  text-align: center;
  border: 1px solid #e5e5e5;
  margin: 14px 0;
}

.hidden-message {
  color: #fff;
  transition: color .35s;
  cursor: default;
}

.image-simulation:hover .hidden-message {
  color: #333;
}

.action {
  cursor: pointer;
  padding: 8px 12px;
  border: 1px solid #bbb;
  background: #eee;
  border-radius: 4px;
  margin-top: 8px;
}

.action:hover { background: #ddd; }

textarea {
  width: 100%;
  min-height: 80px;
  padding: 10px;
  font-family: monospace;
  border: 1px solid #ccc;
  resize: vertical;
}

.status {
  color: #55715b;
  font-size: 12px;
  min-height: 18px;
}

.file-note {
  color: #777;
  font-size: 11px;
  border-top: 1px solid #ddd;
  padding-top: 12px;
}

.properties {
  font-family: monospace;
  font-size: 12px;
  color: #666;
  line-height: 1.9;
}

@media (max-width: 500px) {
  .desktop {
    padding: 12px;
    padding-bottom: 65px;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-auto-rows: 105px;
    gap: 6px;
  }

  .content { padding: 18px; }
  .window { width: 94vw; max-height: 82vh; }
}
</style>
</head>

<body>

</div>

<div class="taskbar">

</div>

<div class="window" id="window" role="dialog" aria-modal="true"

  <div class="content" id="windowContent"></div>
</div>

      <h2>The Game Outside the Game</h2>

      <p>Normally, there is a distinction between the space in which a game is supposed to operate and the world outside it. Players are expected to interact with a game through its established boundaries, such as a set interface.</p>

      <p>However, in games such as <i>Doki Doki Literature Club</i> (DDLC), which is a psychological horror visual novel that initially presents itself as a dating simulation, this boundary can become blurred.</p>

      <p>DDLC further blurs the distinction between gameplay and the outside world by encouraging players to interact with actual game files. For example, deleting certain files within the game’s directory on the player’s computer can affect its progression.</p>

      <p>These actions raise a question: <b>when a game encourages players to interact with things outside its normal interface, where does the game actually end?</b></p>

        <h2>The Game Outside the Game</h2>

        <p>Normally, there is a distinction between the space in which a game is supposed to operate and the world outside it. Players are expected to interact with a game through its established boundaries, such as a set interface. However, in games such as <i>Doki Doki Literature Club</i> (DDLC), which is a psychological horror visual novel that initially presents itself as a dating simulation, this boundary can become blurred.</p>

        <p class="hint">[Paragraph missing. See recovered files.]</p>

      <p>In <i>Homo Ludens</i>, Huizinga describes play as “distinct from ‘ordinary’ life both as to locality and duration.” In other words, play takes place within particular boundaries that distinguish it from everyday activities.</p>

      <p>In DDLC, the character files contain hidden material that players can examine using other programs. These files reveal messages and connections that would not be discovered simply by reading the game’s dialogue.</p>

      <p>In <i>Homo Ludens</i>, Huizinga describes play as “distinct from ‘ordinary’ life both as to locality and duration.” In other words, play takes place within particular boundaries that distinguish it from everyday activities. This idea is often associated with the “magic circle,” a term often used to describe the space in which play takes place and where actions acquire meaning as part of the activity.</p>

      <p>DDLC raises the question of what happens when a game deliberately crosses the boundary between its fictional world and ordinary life. Deleting Monika’s character file requires the player to leave the game and enter the computer’s normal file system, making an ordinary computer function part of the playing experience.</p>

      <p>Unlike deleting Monika’s file, which directly affects progression, investigating the hidden files is optional.</p>

      <p>By following clues from the game’s files to external websites, players extend their investigation beyond the game itself, making the boundary between its narrative and the wider digital environment even less clear.</p>

      <hr>

      <p>Unlike deleting Monika’s file, which directly affects progression, investigating the hidden files is optional. This difference raises a question about how players shape their own experiences: why might someone choose to investigate information that the game does not require them to find?</p>

      <p>Nguyen’s account of games as activities shaped by player participation helps explain why these discoveries matter. He writes that “the player takes a crucial role in constructing the object of the appreciation,” emphasizing how players do not simply receive a fixed experience, but their actions help shape what they encounter and how they experience it.</p>

function openFile(id) {
  const file = files[id];
  if (!file) return;

  document.getElementById("windowTitle").textContent = file.title;
  document.getElementById("windowIcon").textContent = file.icon || "📄";
  document.getElementById("windowContent").innerHTML = file.html;
  document.getElementById("window").style.display = "flex";
  document.getElementById("windowContent").scrollTop = 0;
}

function closeFile() {
  document.getElementById("window").style.display = "none";
}

function checkMorse() {
  const input = document.getElementById("translation");
  const result = document.getElementById("morseResult");

  if (!input || !result) return;

  const answer = input.value
    .toLowerCase()
    .trim()
    .replace(/[.!?]/g, "")
    .replace(/\s+/g, " ");

  if (answer === "where does the game end") {
    result.textContent = "Translation accepted. The question is the point.";
  } else {
    result.textContent = "No match. Check the dots, dashes, and word separators.";
  }
}

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeFile();
});

document.getElementById("clock").textContent =
  new Date().toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });
